<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFC Cart</title>
<link rel="icon" type="image" href="assets/ebpng.webp">
<style>
body{font-family:'Segoe UI',sans-serif;background:#fff8f0;color:#333;padding:2rem;}
h1{text-align:center;color:#d60000;margin-bottom:2rem;}
table{width:100%;border-collapse:collapse;margin-bottom:2rem;}
th,td{padding:12px;text-align:center;border-bottom:1px solid #ddd;}
th{background:#d60000;color:white;}
img{width:80px;height:80px;object-fit:cover;border-radius:5px;}
button{padding:5px 10px;background:#d60000;color:white;border:none;border-radius:5px;cursor:pointer;margin:0 2px;}
button:hover{background:#b00000;}
.qty-btn{background:#fff;color:#d60000;border:1px solid #d60000;padding:2px 8px;}
.qty-btn:hover{background:#d60000;color:#fff;}
.total{font-weight:bold;font-size:1.2rem;text-align:right;margin-top:1rem;}
</style>
</head>
<body>

<h1>Your Cart</h1>

<table id="cartTable">
<thead>
<tr>
<th>Item</th>
<th>Name</th>
<th>Price</th>
<th>Quantity</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<!-- Cart items inserted here -->
</tbody>
</table>

<div class="total" id="grandTotal">Grand Total: ₹0</div>

<script>
// Load cart items
const catalog = {
  "Variety Bucket": { price: 799, img: "assets/KFC-Variety-Bucket.webp" },
  "Box-Meals": { price: 249, img: "assets/KFC-Box-Meals.webp" },
  "Value Lunch": { price: 179, img: "assets/KFC-Value-Lunch.webp" },
  "VEGZINGER": { price: 329, img: "assets/VEGZINGER.jpg" },
  "Zinger Burger": { price: 189, img: "assets/KFC-BOGO-CHICKEN-ZINGER-22-JULY-465-X-327-F1B.webp" },
  "Beverages": { price: 49, img: "assets/KFC-Beverages.webp" },
  "Golden Burger": { price: 219, img: "assets/KFC-Gold-Burger-White-Category-23MAY_4.webp" },
  "Burger": { price: 159, img: "assets/KFC-Burger.webp" },
  "Rice Bowl": { price: 279, img: "assets/KFC-rice-bowl.webp" },
  "Classic Bucket": { price: 499, img: "assets/KFC-Box-Meals.webp" },
  "Hot & Crispy Bucket": { price: 649, img: "assets/KFC-Value-Lunch.webp" },
  "Zinger Box": { price: 299, img: "assets/KFC-BOGO-CHICKEN-ZINGER-22-JULY-465-X-327-F1B.webp" },
  "Chicken Box": { price: 329, img: "assets/KFC-rice-bowl.webp" },
  "Veg Zinger": { price: 179, img: "assets/VEGZINGER.jpg" },
  "Classic Chicken Biryani": { price: 269, img: "assets/Classic Chicken Biryani.jpg" },
  "Smoky Grilled Biryani": { price: 299, img: "assets/Smoky Grilled Biryani.jpg" },
  "Popcorn Chicken": { price: 149, img: "assets/Popcorn Chicken.jpg" },
  "French Fries": { price: 99, img: "assets/French Fries.jpg" },
  "Hot Wings (6 Pc)": { price: 229, img: "assets/Hot Wings (6 Pc).jpg" },
  "Pepsi": { price: 69, img: "assets/KFC-Beverages.webp" },
  "Mirinda": { price: 69, img: "assets/Mirinda.jpg" },
  "7UP": { price: 69, img: "assets/7up.webp" },
  "5 pc Leg Piece Bucket Meal": { price: 619, img: "assets/5 pc Leg Piece Bucket Meal.jpg" },
  "10 pc Hot & Crispy Chicken": { price: 748, img: "assets/10 pc Hot & Crispy Chicken.jpg" },
  "All Chicken Box": { price: 189, img: "assets/All Chicken Box.jpg" },
  "Buddy Popcorn Nachos Meal": { price: 448, img: "assets/Buddy Popcorn Nachos Meal.jpg" },
  "Veg Biryani Bucket": { price: 188, img: "assets/Veg Biryani Bucket.jpg" }
};

let cartItems = JSON.parse(localStorage.getItem("cartItems")) || [];
cartItems = cartItems.map(item => ({
  ...item,
  price: item.price ?? catalog[item.name]?.price ?? 0,
  img: item.img || catalog[item.name]?.img,
  qty: item.qty || 1
}));
const cartTableBody = document.querySelector("#cartTable tbody");
const grandTotalEl = document.getElementById("grandTotal");

// Render cart
function renderCart() {
  cartTableBody.innerHTML = "";
  let grandTotal = 0;

  cartItems.forEach((item, index) => {
    const itemTotal = item.price * item.qty;
    grandTotal += itemTotal;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td><img src="${getImagePath(item.img)}" alt="${item.name}"></td>
      <td>${item.name}</td>
      <td>₹${item.price}</td>
      <td>
        <button class="qty-btn" onclick="decreaseQty(${index})">-</button>
        ${item.qty}
        <button class="qty-btn" onclick="increaseQty(${index})">+</button>
      </td>
      <td>₹${itemTotal}</td>
      <td><button onclick="removeItem(${index})">Remove</button></td>
    `;
    cartTableBody.appendChild(row);
  });

  grandTotalEl.textContent = `Grand Total: ₹${grandTotal}`;
  localStorage.setItem("cartItems", JSON.stringify(cartItems));
}

// Increase quantity
function increaseQty(index) {
  cartItems[index].qty++;
  renderCart();
}

// Decrease quantity
function decreaseQty(index) {
  if(cartItems[index].qty > 1) {
    cartItems[index].qty--;
  } else {
    cartItems.splice(index, 1); // remove if qty reaches 0
  }
  renderCart();
}

// Remove item completely
function removeItem(index) {
  cartItems.splice(index, 1);
  renderCart();
}

// Initial render
renderCart();

function getImagePath(img) {
  if (!img || img.startsWith("assets/") || img.startsWith("http")) {
    return img;
  }

  return `assets/${img}`;
}

// updated addToCart()
function addToCart(itemName) {
  let price = prices[itemName];

  // image mapping
  const images = {
    "Variety Bucket": "assets/KFC-Variety-Bucket.webp",
    "Box-Meals": "assets/KFC-Box-Meals.webp",
    "Value Lunch": "assets/KFC-Value-Lunch.webp",
    "VEGZINGER": "assets/VEGZINGER.jpg",
    "Zinger Burger": "assets/KFC-BOGO-CHICKEN-ZINGER-22-JULY-465-X-327-F1B.webp",
    "Beverages": "assets/KFC-Beverages.webp",
    "Golden Burger": "assets/KFC-Gold-Burger-White-Category-23MAY_4.webp",
    "Burger": "assets/KFC-Burger.webp",
    "Rice Bowl": "assets/KFC-rice-bowl.webp"
  };

  let img = images[itemName];

  alert(itemName + " added to cart! Price: ₹" + price);

  // check if item already exists
  let existing = cartItems.find(item => item.name === itemName);

  if (existing) {
    existing.qty++;       // increase quantity
  } else {
    cartItems.push({
      name: itemName,
      price: price,
      qty: 1,
      img: img
    });
  }

  localStorage.setItem("cartItems", JSON.stringify(cartItems));
  document.getElementById("cart").textContent = cartItems.length;
}

</script>

</body>
</html>
